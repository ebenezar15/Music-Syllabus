<!doctype html>
<html lang="en" data-theme="sunrise">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Syllabus Studio</title>
  <meta name="description" content="Organise, structure and schedule a music teaching syllabus — piano, worship keys, melody and guitar, from beginner to advanced.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">♪</div><div>Syllabus Studio<small>Teach music, step by step</small></div></div>
      <nav class="nav" id="nav">
        <a href="#/home"><span class="ico">🏠</span>Dashboard</a>
        <a href="#/syllabus"><span class="ico">📚</span>Syllabus</a>
        <a href="#/schedule"><span class="ico">🗓️</span>Schedules &amp; Crash Courses</a>
        <a href="#/planner"><span class="ico">🧩</span>Routine Planner</a>
        <a href="#/tools"><span class="ico">🎹</span>Practice Tools</a>
        <a href="#/resources"><span class="ico">📄</span>Cheat Sheets</a>

      <nav class="nav" id="module-nav"></nav>

        <label class="row small muted" style="margin-top:10px"><input type="checkbox" id="auto-theme"> Change scheme on each visit</label>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div>
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Open menu">☰</button>
        <b>Syllabus Studio</b>
        <button class="icon-btn" id="theme-btn" aria-label="Next colour scheme">🎨</button>
      </header>
      <main class="main" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="js/curriculum.js"></script>

  <script src="js/topics/worship.js"></script>
